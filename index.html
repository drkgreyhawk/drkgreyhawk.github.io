<body>
  <main class="terminal">

      <span class="dot"></span>

      <header class="block" style="--i: 0">
        <p class="cmd">whoami</p>
        <h1 class="name">drkgreyhawk</h1>
        <p class="subtitle">Hyrum Mack<span class="sep" aria-hidden="true">/</span>Software Engineer</p>

      <section class="block" style="--i: 1">
        <h2 class="cmd">cat about.txt</h2>

    </div>

  <footer class="footer">
    <p>$ echo "Thanks for visiting"</p>
